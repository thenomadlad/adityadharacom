<svg viewBox="0 0 640 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Loop diagram: open a GitHub issue, check whether to skip it, otherwise create a worktree, write a plan, implement it, push a PR, run CI checks, then move to the next issue. A skip branch loops directly back to the top; completing the checks also loops back for the next issue.">
  <rect x="0" y="0" width="640" height="660" rx="14" fill="#24292e" />

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#df7c4b" />
    </marker>
  </defs>

  <!-- main flow connectors -->
  <line x1="320" y1="70" x2="320" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="320" y1="232" x2="320" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="320" y1="310" x2="320" y2="333" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="320" y1="385" x2="320" y2="408" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="320" y1="460" x2="320" y2="483" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="320" y1="535" x2="320" y2="558" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="345" y="248" font-size="12" fill="#df7c4b">proceed</text>

  <!-- skip loop: diamond left tip back up to box 1 -->
  <path d="M190,165 C100,165 100,45 208,45" fill="none" stroke="#df7c4b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)" />
  <text x="60" y="108" font-size="12" fill="#df7c4b">skip</text>

  <!-- next-issue loop: box 7 right side back up to box 1 right side -->
  <path d="M430,585 C560,585 560,45 432,45" fill="none" stroke="#df7c4b" stroke-width="2" marker-end="url(#arrow-orange)" />
  <text x="495" y="315" font-size="12" fill="#df7c4b">next issue</text>

  <!-- box 1: open issue -->
  <rect x="210" y="20" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="50" text-anchor="middle" font-size="14" fill="#1a1a2e">Open a GitHub issue</text>

  <!-- decision diamond -->
  <polygon points="320,100 450,165 320,230 190,165" fill="#ececff" />
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#1a1a2e">Skip?</text>
  <text x="320" y="167" text-anchor="middle" font-size="12" fill="#1a1a2e">label · dependency</text>
  <text x="320" y="184" text-anchor="middle" font-size="12" fill="#1a1a2e">· already healthy</text>

  <!-- box 3: worktree -->
  <rect x="210" y="260" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="290" text-anchor="middle" font-size="14" fill="#1a1a2e">Fresh git worktree</text>

  <!-- box 4: plan -->
  <rect x="210" y="335" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="365" text-anchor="middle" font-size="14" fill="#1a1a2e">Plan: write + commit</text>

  <!-- box 5: implement -->
  <rect x="210" y="410" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="440" text-anchor="middle" font-size="14" fill="#1a1a2e">Implement against plan</text>

  <!-- box 6: PR -->
  <rect x="210" y="485" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="515" text-anchor="middle" font-size="14" fill="#1a1a2e">Push branch, open PR</text>

  <!-- box 7: CI checks -->
  <rect x="210" y="560" width="220" height="50" rx="8" fill="#ececff" />
  <text x="320" y="590" text-anchor="middle" font-size="14" fill="#1a1a2e">CI + mergeability checks</text>
</svg>
